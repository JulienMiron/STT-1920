project:
  type: website
  output-dir: _site
  # liste explicite : sans ça, Quarto essaie aussi de rendre les fichiers de
  # notes/, qui est un sous-projet Quarto indépendant (voir notes/_quarto.yml)
  render:
    - index.qmd
    - diapos.qmd
  resources:
    - "diapos/Chapitre_*.pdf"      # PDF compilés par diapos/compiler.sh (voir le workflow)

website:
  title: "STT-1920 Méthodes statistiques"
  site-url: https://julienmiron.github.io/STT-1920/
  repo-url: https://github.com/JulienMiron/STT-1920
  repo-actions: [edit, issue]

  page-footer:
    left: "Site de cours STT-1920"
    right: "Généré avec Quarto"

  navbar:
    background: "#0E9E6C"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Accueil
      - href: diapos.qmd
        text: Diapositives
      - href: notes/index.html
        text: Notes de cours

lang: fr
language:
  title-block-author-single: "Auteur"
  title-block-modified: "Dernière modification"
date-modified: last-modified
date-format: "D MMMM YYYY"

format:
  html:
    favicon: notes/images/favicon.png
    theme: lumen
    css: styles.css
    toc: false

editor: source
