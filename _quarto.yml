project:
  type: book
  output-dir: _book
  pre-render: R/logo.R    # régénère images/logo.png dans la couleur --accent de styles.css
  resources:
    - ressources/STT-1920-Belisle-2020.pdf
    - "diapos/Chapitre_*.pdf"      # PDF compilés par diapos/compiler.sh (voir le workflow)

book:
  title: "Méthodes statistiques -- STT-1920"
  author: "Julien Miron"
  output-file: STT-1920

  site-url: https://JulienMiron.github.io/STT-1920/
  repo-url: https://github.com/JulienMiron/STT-1920
  repo-actions: [edit, issue]
  search: true

  page-footer:
    left: "Notes de cours STT-1920"
    right: "Généré avec Quarto"

  sidebar:
    style: floating
    collapse-level: 1              # replie tout sauf les titres de chapitre
    logo: images/logo.png          # affichée au-dessus du titre dans la sidebar

  chapters:
    - index.qmd
    - diapos.qmd
    - 01-statistique-descriptive.qmd
    - 02-probabilites.qmd
    - 03-un-echantillon.qmd
    - 04-deux-echantillons.qmd
    - 05-anova.qmd
    - 06-regression.qmd
    - 07-khi-deux.qmd
  appendices:
    - A-tables.qmd

crossref:
  chapters: true                   # numérotation des figures/tableaux tient compte du chapitre
  eq-prefix: "équation"
  fig-prefix: "figure"
  tbl-prefix: "tableau"
  fig-title: "Figure"
  tbl-title: "Tableau"

# Réglages de langue et de dates (affichage en français)
lang: fr
language:
  title-block-author-single: "Auteur"
  title-block-modified: "Dernière modification"
date-modified: last-modified       # date mise à jour automatiquement au rendu
date-format: "D MMMM YYYY"

knitr:
  opts_chunk:
    comment: "#>"
    fig-align: center
    fig-width: 6
    fig-asp: 0.62
    out-width: "80%"


format:
  pdf:
    documentclass: scrbook
    toc: true
    number-sections: true

  html:
    favicon: images/favicon.png
    grid:
      sidebar-width: 300px   # sidebar de gauche (chapitres) — défaut 250px
      margin-width: 250px    # TdM de droite — défaut ~200-250px selon thème
      gutter-width: 1rem     # espace entre les colonnes

    theme: cosmo
    css: styles.css
    toc: true
    toc-expand: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-fold: true                # le code R des figures reste replié
    code-summary: "Code R"
    smooth-scroll: true
    html-math-method: mathjax

editor: source
